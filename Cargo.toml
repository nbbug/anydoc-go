# Go bindings for anydoc.
#
# `crate-type = ["staticlib", "cdylib"]`: the Go module links the static
# archive by default; the cdylib output powers the opt-in dynamic-library
# build (see the Build dynamic libraries workflow and the `dynamic` build
# tag). Not a plain cdylib: cgo wants either an archive it can pull symbols
# from or an import library for a dylib.
[package]
name = "anydoc-go"
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
description = "Go bindings (C ABI) for anydoc"
license = "MIT"
repository = "https://github.com/firecrawl/anydoc"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

# Standalone crate: it lives outside the anydoc workspace, so it takes the
# published crate rather than a path dependency.
# Pinned exactly: the C ABI mirrors this version's error and format enums.
[dependencies]
anydoc = "=0.2.4"

[build-dependencies]
cbindgen = "0.29"

# document_to_markdown is crate-private in published anydoc. The build script
# copies the pinned version above and re-exports that one function so we can
# keep the official GFM serializer after rewriting asset images to External URLs.
[patch.crates-io]
anydoc = { path = "patched-anydoc" }

[workspace]

# The archive is a staticlib consumed by the Go linker, so build time is paid
# once in CI while runtime size and speed win:
# - fat LTO (whole-graph dead-code elimination and cross-crate inlining) beats
#   thin LTO for a library that is linked as a unit
# - strip keeps debug symbols and local symbol names out of the archive
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
