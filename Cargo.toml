# Go bindings for anydoc.
#
# `crate-type = ["cdylib"]`: the Go bindings link the shared library, which the
# Build libraries workflow publishes per platform; the module itself carries no
# binary. No staticlib is built: the archive was only there to be linked into
# Go binaries, and the shared library covers every supported platform.
[package]
name = "anydoc-go"
version = "0.2.5"
edition = "2024"
rust-version = "1.88"
description = "Go bindings (C ABI) for anydoc"
license = "MIT"
repository = "https://github.com/firecrawl/anydoc"
publish = false

[lib]
crate-type = ["cdylib"]

# Standalone crate: it lives outside the anydoc workspace, so it takes the
# published crate rather than a path dependency.
# Pinned exactly: the C ABI mirrors this version's error and format enums.
[dependencies]
anydoc = "=0.2.5"

[build-dependencies]
cbindgen = "0.29"

# document_to_markdown is crate-private in published anydoc. The build script
# copies the pinned version above and re-exports that one function so we can
# keep the official GFM serializer after rewriting asset images to External URLs.
[patch.crates-io]
anydoc = { path = "patched-anydoc" }

[workspace]

# The shared library is consumed through a C ABI, so build time is paid once in
# CI while runtime size and speed win:
# - fat LTO (whole-graph dead-code elimination and cross-crate inlining)
# - strip keeps debug symbols and local symbol names out of the library
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
