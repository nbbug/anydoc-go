name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Go and Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - name: gofmt check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed on:"; echo "$files"
            exit 1
          fi

      - name: Version pin agreement (Cargo.toml ↔ version.go)
        run: |
          cargo_version=$(sed -n 's/^anydoc = "=\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          go_version=$(sed -n 's/^const Version = "\([^"]*\)".*/\1/p' version.go | head -1)
          if [ "$cargo_version" != "$go_version" ]; then
            echo "error: Cargo.toml pins anydoc $cargo_version but version.go says $go_version" >&2
            exit 1
          fi
          echo "anydoc pin: $cargo_version"

      # Stub builds: the package must compile and fail gracefully everywhere,
      # with cgo disabled and without any downloaded library.
      - name: Test without cgo (stub path)
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test ./...

      # The shared libraries are release assets, not repository files. Build
      # the host one so the cgo suite can actually link and load it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-go-ci
      - name: Build linux/amd64 shared library
        run: ./scripts/build-anydoc-lib.sh

      # Go 1.26.11 and 1.27.4 reject cgo linker inputs that carry LLVM LTO IR;
      # later patch releases accept the sections again (golang.org/issue/83126).
      # The go command also inspects shared libraries in -L directories, so
      # linking with 1.27.4 keeps the shipped .so honest for the users still on
      # the strict releases.
      - name: Link with Go 1.27.4 (the cgo release that rejects LTO IR)
        run: |
          export LD_LIBRARY_PATH="$PWD/lib/linux_amd64"
          GOTOOLCHAIN=go1.27.4 go build ./examples/convert ./examples/parse

      - name: Test with cgo (linux/amd64 shared library)
        run: |
          export LD_LIBRARY_PATH="$PWD/lib/linux_amd64"
          go vet ./...
          go test ./...
          go build ./examples/convert ./examples/parse
