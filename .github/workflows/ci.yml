name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Go and Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - name: gofmt check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed on:"; echo "$files"
            exit 1
          fi

      - name: Version pin agreement (Cargo.toml ↔ version.go)
        run: |
          cargo_version=$(sed -n 's/^anydoc = "=\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          go_version=$(sed -n 's/^const Version = "\([^"]*\)".*/\1/p' version.go | head -1)
          if [ "$cargo_version" != "$go_version" ]; then
            echo "error: Cargo.toml pins anydoc $cargo_version but version.go says $go_version" >&2
            exit 1
          fi
          echo "anydoc pin: $cargo_version"

      # Stub builds: the package must compile and fail gracefully everywhere,
      # with cgo disabled and without any downloaded libraries.
      - name: Test without cgo (stub path)
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test ./...

      # The `anydoc_dynamic` tag must keep compiling: vet does not link, so it
      # needs only the committed header, not a downloaded shared library.
      - name: Vet with the dynamic tag (no link)
        run: |
          go vet -tags anydoc_dynamic ./...
          CGO_ENABLED=0 go vet -tags anydoc_dynamic ./...

      # The static libraries are release assets, not repository files. Build
      # the host archive so the full cgo suite can actually link and run.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-go-ci
      - name: Build linux/amd64 static library
        run: ./scripts/build-anydoc-lib.sh

      - name: Test with cgo (linux/amd64 static library)
        run: |
          go vet ./...
          go test ./...
          go build ./examples/convert ./examples/parse
