name: Build static libraries

# Builds the anydoc static archives for every supported platform and pushes
# them to the main branch. Trigger it manually (Actions → "Build static
# libraries" → Run workflow) after changing the `anydoc = "=X.Y.Z"` pin in
# Cargo.toml, after upgrading Rust tooling, or whenever the committed archives
# fall out of date. The archives are ~20 MB each, so they are built on demand
# rather than on every push.
#
# Platform split across runners: Linux builds on ubuntu (native + cross),
# Windows with MSVC on a native Windows runner (MSVC cannot be redistributed),
# and macOS on a macOS runner (Apple's SDK cannot be redistributed).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to commit the archives to"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  # Linux (glibc) archives. Linux/amd64 builds natively; Linux/arm64 uses
  # cross.
  build-linux:
    name: Build linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            tool: cargo
            dir: linux_amd64
          - target: aarch64-unknown-linux-gnu
            tool: cross
            dir: linux_arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-go-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: matrix.tool == 'cross'
        with:
          tool: cross
      - name: Build archive
        run: BUILD_TOOL=${{ matrix.tool }} TARGET=${{ matrix.target }} ./scripts/build-anydoc-lib.sh
      # Each artifact carries only its own archive: the push job merges all
      # artifacts into one tree, and download-artifact corrupts files whose
      # path arrives from more than one artifact (collisions appended or
      # truncated the merged files). One file per path across all artifacts
      # keeps the merge lossless.
      - name: Stage archive
        run: |
          mkdir -p staging/lib
          cp -R "lib/${{ matrix.dir }}" staging/lib/
          # cbindgen regenerates include/anydoc.h during the build; the
          # regenerated header is committed alongside the archives so the
          # committed copy can never drift from the Rust source. Same for
          # Cargo.lock on the first run. Only this job carries them: same
          # single-source rule as the archives.
          if [ "${{ matrix.dir }}" = linux_amd64 ]; then
            cp include/anydoc.h staging/anydoc.h
            cp Cargo.lock staging/Cargo.lock 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: archives-${{ matrix.target }}
          path: staging
          if-no-files-found: error

  # Windows archives, built with the MSVC toolchain on a native Windows
  # runner (matching the WeKnora binding). MSVC cannot be redistributed, so
  # neither cross nor zig can produce these targets from Linux. The resulting
  # COFF anydoc_go.lib is linked by the mingw gcc that Go's cgo uses.
  build-windows:
    name: Build windows (${{ matrix.target }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            dir: windows_amd64
          - target: aarch64-pc-windows-msvc
            dir: windows_arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-go-${{ matrix.target }}
      - name: Build archive
        shell: bash
        run: TARGET=${{ matrix.target }} ./scripts/build-anydoc-lib.sh
      - name: Stage archive
        shell: bash
        run: |
          mkdir -p staging/lib
          cp -R "lib/${{ matrix.dir }}" staging/lib/
      - uses: actions/upload-artifact@v7
        with:
          name: archives-${{ matrix.target }}
          path: staging
          if-no-files-found: error

  # macOS archives. Both architectures build on the arm64 runner: aarch64
  # natively, x86_64 through the universal Xcode toolchain (the crate tree is
  # pure Rust, so no C toolchain is needed). Apple's SDK cannot be
  # redistributed, so these cannot be built from Linux with cross.
  build-darwin:
    name: Build darwin (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            dir: darwin_arm64
          - target: x86_64-apple-darwin
            dir: darwin_amd64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-go-${{ matrix.target }}
      - name: Build archive
        run: TARGET=${{ matrix.target }} ./scripts/build-anydoc-lib.sh
      - name: Stage archive
        run: |
          mkdir -p staging/lib
          cp -R "lib/${{ matrix.dir }}" staging/lib/
      - uses: actions/upload-artifact@v7
        with:
          name: archives-${{ matrix.target }}
          path: staging
          if-no-files-found: error

  # Smoke-test the fresh archives by linking the Go package against them
  # before they land on main: a broken archive must fail the workflow, not
  # reach users.
  push:
    name: Commit and push archives
    needs: [build-linux, build-windows, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: archives-*
          path: staging
          merge-multiple: true
      - name: Stage into repository
        run: |
          cp -R staging/lib/. lib/
          cp -f staging/anydoc.h include/anydoc.h
          cp -f staging/Cargo.lock Cargo.lock
      # The merged artifacts must be byte-exact: parse every archive's member
      # headers and require the file to end exactly at its last member. This
      # is what catches artifact-merge corruption ("archive member invalid
      # control bits" at link time was the symptom it shipped once).
      - name: Verify staged archives
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          archives = sorted(pathlib.Path("lib").rglob("*.a")) + sorted(pathlib.Path("lib").rglob("*.lib"))
          if len(archives) != 6:
              sys.exit(f"error: expected 6 staged archives, found {len(archives)}: {archives}")
          for path in archives:
              data = path.read_bytes()
              if not data.startswith(b"!<arch>\n"):
                  sys.exit(f"error: {path} does not start with an ar magic header")
              members = 0
              pos = 8
              while pos < len(data):
                  if len(data) - pos < 60:
                      sys.exit(f"error: {path} has {len(data) - pos} stray bytes after the last member")
                  size_field = data[pos + 48:pos + 58].rstrip(b" ")
                  try:
                      size = int(size_field)
                  except ValueError:
                      sys.exit(f"error: {path} member header at offset {pos} has a non-numeric size field")
                  pos += 60 + size + (size & 1)  # members are padded to even length
                  members += 1
              if pos != len(data):
                  sys.exit(f"error: {path} is {len(data) - pos} bytes longer than its members declare")
              # Fat LTO merges each crate's code into one object, so a full
              # build has ~280 members (thin LTO had ~650). The floor only
              # catches archives truncated at a member boundary, which the
              # exact-end check above cannot see.
              if members < 100:
                  sys.exit(f"error: {path} has only {members} members; expected a full build (280+)")
              print(f"OK: {path} ({members} members, {len(data)} bytes)")
          PYEOF
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - name: Smoke test (link + convert)
        run: |
          go build ./...
          go test -run 'TestToMarkdownBytesCSV|TestToDocumentDocx|TestEmbeddedLibAndExtract|TestWireConstsMatchHeader' .
      # No explicit token is configured here: actions/checkout above injects
      # the workflow's GITHUB_TOKEN into the git config (persist-credentials
      # defaults to true), and the workflow-level `permissions:
      # contents: write` grants it push rights. Caveats: branch protection on
      # the target branch rejects the push, and pushes made with GITHUB_TOKEN
      # deliberately do not trigger other workflows (the archives commit does
      # not re-run ci.yml).
      - name: Commit and push
        run: |
          version=$(sed -n 's/^anydoc = "=\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git diff cannot see untracked files, and a newly added platform
          # (lib/windows_arm64) arrives exactly as an untracked directory —
          # the porcelain status covers both modified and untracked paths.
          if [ -z "$(git status --porcelain lib include/anydoc.h Cargo.lock)" ]; then
            echo "No changes; the committed archives are already current."
            exit 0
          fi
          git add lib include/anydoc.h Cargo.lock
          git commit -m "chore: rebuild anydoc static libraries (anydoc v${version})"
          git push origin "HEAD:${{ github.event.inputs.branch }}"
