name: Build libraries

# Builds the static archive and the shared library for every supported
# platform in one run, packages one tarball per platform and kind, and
# publishes them all to a single GitHub release. Nothing is committed to the
# repository: users download the tarball for their platform and point cgo at
# it (see the README, "Prebuilt libraries").
#
# Trigger it manually (Actions → "Build libraries" → Run workflow) after
# changing the `anydoc = "=X.Y.Z"` pin, the C ABI, or the platform matrix.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag of the release to create or update"
        required: false
        default: "libs-v0.2.5"

permissions:
  contents: write

jobs:
  # Linux (glibc) libraries. Linux/amd64 builds natively; Linux/arm64 uses
  # cross.
  build-linux:
    name: Build linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            tool: cargo
            dir: linux_amd64
            static: libanydoc_go.a
            shared: libanydoc_go.so
          - target: aarch64-unknown-linux-gnu
            tool: cross
            dir: linux_arm64
            static: libanydoc_go.a
            shared: libanydoc_go.so
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-go-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: matrix.tool == 'cross'
        with:
          tool: cross
      - name: Build static and shared libraries
        run: LIBS=both BUILD_TOOL=${{ matrix.tool }} TARGET=${{ matrix.target }} ./scripts/build-anydoc-lib.sh
      - name: Package
        run: |
          mkdir -p "pkg-static/lib/${{ matrix.dir }}" pkg-static/include
          mkdir -p "pkg-dynamic/lib/${{ matrix.dir }}" pkg-dynamic/include
          cp "lib/${{ matrix.dir }}/${{ matrix.static }}" "pkg-static/lib/${{ matrix.dir }}/"
          cp "lib/${{ matrix.dir }}/${{ matrix.shared }}" "pkg-dynamic/lib/${{ matrix.dir }}/"
          cp include/anydoc.h pkg-static/include/
          cp include/anydoc.h pkg-dynamic/include/
          mkdir -p dist
          tar -czf "dist/anydoc-static-${{ matrix.dir }}.tar.gz" -C pkg-static .
          tar -czf "dist/anydoc-dynlib-${{ matrix.dir }}.tar.gz" -C pkg-dynamic .
      - uses: actions/upload-artifact@v7
        with:
          name: libs-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # Windows libraries, built with the MSVC toolchain on a native Windows
  # runner. MSVC cannot be redistributed, so neither cross nor zig can produce
  # these targets from Linux. The resulting COFF anydoc_go.lib is linked by
  # the mingw gcc that Go's cgo uses.
  build-windows:
    name: Build windows (${{ matrix.target }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            dir: windows_amd64
            static: anydoc_go.lib
            shared: anydoc_go.dll
          - target: aarch64-pc-windows-msvc
            dir: windows_arm64
            static: anydoc_go.lib
            shared: anydoc_go.dll
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-go-${{ matrix.target }}
      - name: Build static and shared libraries
        shell: bash
        run: LIBS=both TARGET=${{ matrix.target }} ./scripts/build-anydoc-lib.sh
      - name: Package
        shell: bash
        run: |
          mkdir -p "pkg-static/lib/${{ matrix.dir }}" pkg-static/include
          mkdir -p "pkg-dynamic/lib/${{ matrix.dir }}" pkg-dynamic/include
          cp "lib/${{ matrix.dir }}/${{ matrix.static }}" "pkg-static/lib/${{ matrix.dir }}/"
          cp "lib/${{ matrix.dir }}/${{ matrix.shared }}" "pkg-dynamic/lib/${{ matrix.dir }}/"
          cp include/anydoc.h pkg-static/include/
          cp include/anydoc.h pkg-dynamic/include/
          mkdir -p dist
          tar -czf "dist/anydoc-static-${{ matrix.dir }}.tar.gz" -C pkg-static .
          tar -czf "dist/anydoc-dynlib-${{ matrix.dir }}.tar.gz" -C pkg-dynamic .
      - uses: actions/upload-artifact@v7
        with:
          name: libs-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # macOS libraries. Both architectures build on the arm64 runner: aarch64
  # natively, x86_64 through the universal Xcode toolchain (the crate tree is
  # pure Rust, so no C toolchain is needed). Apple's SDK cannot be
  # redistributed, so these cannot be built from Linux with cross.
  build-darwin:
    name: Build darwin (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            dir: darwin_arm64
            static: libanydoc_go.a
            shared: libanydoc_go.dylib
          - target: x86_64-apple-darwin
            dir: darwin_amd64
            static: libanydoc_go.a
            shared: libanydoc_go.dylib
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-go-${{ matrix.target }}
      - name: Build static and shared libraries
        run: LIBS=both TARGET=${{ matrix.target }} ./scripts/build-anydoc-lib.sh
      - name: Package
        run: |
          mkdir -p "pkg-static/lib/${{ matrix.dir }}" pkg-static/include
          mkdir -p "pkg-dynamic/lib/${{ matrix.dir }}" pkg-dynamic/include
          cp "lib/${{ matrix.dir }}/${{ matrix.static }}" "pkg-static/lib/${{ matrix.dir }}/"
          cp "lib/${{ matrix.dir }}/${{ matrix.shared }}" "pkg-dynamic/lib/${{ matrix.dir }}/"
          cp include/anydoc.h pkg-static/include/
          cp include/anydoc.h pkg-dynamic/include/
          mkdir -p dist
          tar -czf "dist/anydoc-static-${{ matrix.dir }}.tar.gz" -C pkg-static .
          tar -czf "dist/anydoc-dynlib-${{ matrix.dir }}.tar.gz" -C pkg-dynamic .
      - uses: actions/upload-artifact@v7
        with:
          name: libs-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  release:
    name: Publish libraries
    needs: [build-linux, build-windows, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: libs-*
          path: dist
          merge-multiple: true
      # A packaging mistake (missing platform, archive, or header) must fail
      # here rather than ship a broken release asset.
      - name: Verify packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          static=(dist/anydoc-static-*.tar.gz)
          dynamic=(dist/anydoc-dynlib-*.tar.gz)
          if [ ${#static[@]} -ne 6 ] || [ ${#dynamic[@]} -ne 6 ]; then
            echo "error: expected 6 static and 6 dynamic tarballs," \
                 "found ${#static[@]} and ${#dynamic[@]}" >&2
            exit 1
          fi
          for tarball in "${static[@]}"; do
            listing=$(tar -tzf "$tarball")
            echo "$listing" | grep -qx './include/anydoc.h'
            echo "$listing" | grep -Eq '^\./lib/[^/]+/(libanydoc_go\.a|anydoc_go\.lib)$'
            echo "OK: $tarball"
          done
          for tarball in "${dynamic[@]}"; do
            listing=$(tar -tzf "$tarball")
            echo "$listing" | grep -qx './include/anydoc.h'
            echo "$listing" | grep -Eq '^\./lib/[^/]+/(libanydoc_go\.so|libanydoc_go\.dylib|anydoc_go\.dll)$'
            echo "OK: $tarball"
          done
      # Link and run the Go suite against the actual release tarballs, so a
      # broken package fails the workflow before it reaches users.
      - name: Smoke test static package
        run: |
          set -euo pipefail
          tar -xzf dist/anydoc-static-linux_amd64.tar.gz -C .
          go test -count=1 ./...
      - name: Smoke test dynamic package
        run: |
          set -euo pipefail
          mkdir -p lib/linux_amd64 /tmp/anydoc-dyn
          tar -xzf dist/anydoc-dynlib-linux_amd64.tar.gz -C /tmp/anydoc-dyn
          cp /tmp/anydoc-dyn/lib/linux_amd64/libanydoc_go.so lib/linux_amd64/
          LD_LIBRARY_PATH="$PWD/lib/linux_amd64" go test -count=1 -tags anydoc_dynamic ./...
      - name: Write checksums
        run: |
          cd dist
          sha256sum anydoc-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: anydoc-go libraries ${{ github.event.inputs.release_tag }}
          body: |
            Prebuilt anydoc-go libraries for every supported platform, built
            from the pinned anydoc crate. Nothing is committed to the
            repository: download the tarball for your platform and point cgo
            at it (see the README, "Prebuilt libraries").

            **Static** — the default build (`go build ./...`):

            | Platform | Asset |
            | --- | --- |
            | linux/amd64 | `anydoc-static-linux_amd64.tar.gz` |
            | linux/arm64 | `anydoc-static-linux_arm64.tar.gz` |
            | darwin/amd64 | `anydoc-static-darwin_amd64.tar.gz` |
            | darwin/arm64 | `anydoc-static-darwin_arm64.tar.gz` |
            | windows/amd64 | `anydoc-static-windows_amd64.tar.gz` |
            | windows/arm64 | `anydoc-static-windows_arm64.tar.gz` |

            **Dynamic** — build with `-tags anydoc_dynamic`:

            | Platform | Asset |
            | --- | --- |
            | linux/amd64 | `anydoc-dynlib-linux_amd64.tar.gz` |
            | linux/arm64 | `anydoc-dynlib-linux_arm64.tar.gz` |
            | darwin/amd64 | `anydoc-dynlib-darwin_amd64.tar.gz` |
            | darwin/arm64 | `anydoc-dynlib-darwin_arm64.tar.gz` |
            | windows/amd64 | `anydoc-dynlib-windows_amd64.tar.gz` |
            | windows/arm64 | `anydoc-dynlib-windows_arm64.tar.gz` |

            Each tarball lays out `lib/<platform>/<library>` plus
            `include/anydoc.h`. Verify downloads with
            `sha256sum -c SHA256SUMS` (`shasum -a 256 -c SHA256SUMS` on macOS).
          files: |
            dist/anydoc-static-*.tar.gz
            dist/anydoc-dynlib-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
