name: Build libraries

# Builds the shared library for every supported platform, packages one tarball
# per platform, and publishes them all to a single GitHub release. Nothing is
# committed to the repository: users download the tarball for their platform
# and point cgo at it (see the README, "Prebuilt libraries"). The library is
# loaded at run time, so it has to ship next to the program.
#
# Trigger it manually (Actions → "Build libraries" → Run workflow) after
# changing the `anydoc = "=X.Y.Z"` pin, the C ABI, or the platform matrix.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag of the release to create or update"
        required: false
        default: "libs-v0.2.5"

permissions:
  contents: write

jobs:
  # Linux (glibc) libraries. Linux/amd64 builds natively; Linux/arm64 uses
  # cross.
  build-linux:
    name: Build linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            tool: cargo
            dir: linux_amd64
          - target: aarch64-unknown-linux-gnu
            tool: cross
            dir: linux_arm64
    steps:
      - uses: actions/checkout@v6
      # llvm-tools supplies llvm-nm, which reads every Rust target: the host
      # binutils nm of the runner cannot read the arm64 library.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-go-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: matrix.tool == 'cross'
        with:
          tool: cross
      - name: Build shared library
        run: BUILD_TOOL=${{ matrix.tool }} TARGET=${{ matrix.target }} ./scripts/build-anydoc-lib.sh
      - name: Package
        run: |
          mkdir -p "pkg/lib/${{ matrix.dir }}" pkg/include
          cp "lib/${{ matrix.dir }}/"* "pkg/lib/${{ matrix.dir }}/"
          cp include/anydoc.h pkg/include/
          mkdir -p dist
          tar -czf "dist/anydoc-dynlib-${{ matrix.dir }}.tar.gz" -C pkg .
      - uses: actions/upload-artifact@v7
        with:
          name: libs-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # Windows libraries, built with the MSVC toolchain on a native Windows
  # runner. MSVC cannot be redistributed, so neither cross nor zig can produce
  # these targets from Linux.
  build-windows:
    name: Build windows (${{ matrix.target }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            dir: windows_amd64
          - target: aarch64-pc-windows-msvc
            dir: windows_arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-go-${{ matrix.target }}
      - name: Build shared library
        shell: bash
        run: TARGET=${{ matrix.target }} ./scripts/build-anydoc-lib.sh
      - name: Package
        shell: bash
        run: |
          mkdir -p "pkg/lib/${{ matrix.dir }}" pkg/include
          cp "lib/${{ matrix.dir }}/"* "pkg/lib/${{ matrix.dir }}/"
          cp include/anydoc.h pkg/include/
          mkdir -p dist
          tar -czf "dist/anydoc-dynlib-${{ matrix.dir }}.tar.gz" -C pkg .
      - uses: actions/upload-artifact@v7
        with:
          name: libs-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # macOS libraries. Both architectures build on the arm64 runner: aarch64
  # natively, x86_64 through the universal Xcode toolchain. Apple's SDK cannot
  # be redistributed, so these cannot be built from Linux with cross.
  build-darwin:
    name: Build darwin (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            dir: darwin_arm64
            goarch: arm64
          - target: x86_64-apple-darwin
            dir: darwin_amd64
            goarch: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-go-${{ matrix.target }}
      - name: Build shared library
        run: TARGET=${{ matrix.target }} ./scripts/build-anydoc-lib.sh
      # Link the packaged dylib from a Go program, with the release whose cgo
      # check is strict (golang.org/issue/83126): a library Go cannot accept,
      # or one with unresolved symbols, fails here instead of at a user's desk.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - name: Link the library with Go 1.27.4
        env:
          GOTOOLCHAIN: go1.27.4
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
        run: go build ./examples/convert ./examples/parse
      - name: Package
        run: |
          mkdir -p "pkg/lib/${{ matrix.dir }}" pkg/include
          cp "lib/${{ matrix.dir }}/"* "pkg/lib/${{ matrix.dir }}/"
          cp include/anydoc.h pkg/include/
          mkdir -p dist
          tar -czf "dist/anydoc-dynlib-${{ matrix.dir }}.tar.gz" -C pkg .
      - uses: actions/upload-artifact@v7
        with:
          name: libs-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  release:
    name: Publish libraries
    needs: [build-linux, build-windows, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: libs-*
          path: dist
          merge-multiple: true
      # A packaging mistake (missing platform, archive, or header) must fail
      # here rather than ship a broken release asset.
      - name: Verify packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          dynamic=(dist/anydoc-dynlib-*.tar.gz)
          if [ ${#dynamic[@]} -ne 6 ]; then
            echo "error: expected 6 dynamic tarballs, found ${#dynamic[@]}" >&2
            exit 1
          fi
          for tarball in "${dynamic[@]}"; do
            listing=$(tar -tzf "$tarball")
            echo "$listing" | grep -qx './include/anydoc.h'
            echo "$listing" | grep -Eq '^\./lib/[^/]+/(libanydoc_go\.so|libanydoc_go\.dylib|anydoc_go\.dll)$'
            echo "OK: $tarball"
          done
      # Link and run the Go suite against the actual release tarball, with the
      # Go release whose cgo check rejects LTO IR, so a broken package fails
      # the workflow before it reaches users.
      - name: Smoke test the linux/amd64 package
        run: |
          set -euo pipefail
          tar -xzf dist/anydoc-dynlib-linux_amd64.tar.gz -C .
          LD_LIBRARY_PATH="$PWD/lib/linux_amd64" \
            GOTOOLCHAIN=go1.27.4 go test -count=1 ./...
      - name: Write checksums
        run: |
          cd dist
          sha256sum anydoc-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: anydoc-go libraries ${{ github.event.inputs.release_tag }}
          body: |
            Prebuilt anydoc-go shared libraries for every supported platform,
            built from the pinned anydoc crate. Nothing is committed to the
            repository: download the tarball for your platform and point cgo at
            it (see the README, "Prebuilt libraries").

            | Platform | Asset |
            | --- | --- |
            | linux/amd64 | `anydoc-dynlib-linux_amd64.tar.gz` |
            | linux/arm64 | `anydoc-dynlib-linux_arm64.tar.gz` |
            | darwin/amd64 | `anydoc-dynlib-darwin_amd64.tar.gz` |
            | darwin/arm64 | `anydoc-dynlib-darwin_arm64.tar.gz` |
            | windows/amd64 | `anydoc-dynlib-windows_amd64.tar.gz` |
            | windows/arm64 | `anydoc-dynlib-windows_arm64.tar.gz` |

            Each tarball lays out `lib/<platform>/` (the `.so`/`.dylib`, or
            `anydoc_go.dll` plus its import library on Windows) and
            `include/anydoc.h`. The library is loaded at run time: put that
            directory on `LD_LIBRARY_PATH` (Linux) or `DYLD_LIBRARY_PATH`
            (macOS), or place `anydoc_go.dll` next to the executable (Windows).
            Verify downloads with `sha256sum -c SHA256SUMS`
            (`shasum -a 256 -c SHA256SUMS` on macOS).
          files: |
            dist/anydoc-dynlib-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
